<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华为工龄计算器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #c8102e 0%, #8b0000 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 40px;
    width: 100%;
    max-width: 460px;
  }
  .logo {
    text-align: center;
    margin-bottom: 8px;
  }
  .logo span {
    display: inline-block;
    background: #c8102e;
    color: #fff;
    font-size: 28px;
    font-weight: bold;
    padding: 6px 18px;
    border-radius: 8px;
    letter-spacing: 2px;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    color: #333;
    margin: 16px 0 6px;
  }
  .subtitle {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-bottom: 28px;
  }
  .label {
    font-size: 14px;
    color: #555;
    margin-bottom: 10px;
    font-weight: 500;
  }
  .inputs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .inputs div {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .inputs label {
    font-size: 12px;
    color: #999;
    margin-bottom: 4px;
    text-align: center;
  }
  .inputs input {
    width: 100%;
    padding: 12px 8px;
    font-size: 16px;
    text-align: center;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
  }
  .inputs input:focus {
    border-color: #c8102e;
  }
  button {
    width: 100%;
    padding: 14px;
    background: #c8102e;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #a80d26; }
  button:active { transform: scale(0.99); }
  .result {
    margin-top: 28px;
    padding: 24px;
    background: #fff7f8;
    border: 1px dashed #e8a0ac;
    border-radius: 12px;
    text-align: center;
    display: none;
  }
  .result.show { display: block; animation: fadeIn 0.4s; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .days-num {
    font-size: 42px;
    font-weight: bold;
    color: #c8102e;
    line-height: 1.2;
  }
  .days-unit {
    font-size: 16px;
    color: #c8102e;
    margin-left: 4px;
  }
  .breakdown {
    margin-top: 12px;
    font-size: 14px;
    color: #666;
  }
  .error {
    color: #c8102e;
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
    min-height: 18px;
  }
  .today {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    margin-top: 18px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span>HUAWEI</span></div>
    <h1>华为工龄计算器</h1>
    <p class="subtitle">输入你加入华为的日期，看看已经奋斗了多少天</p>

    <div class="label">入职日期</div>
    <div class="inputs">
      <div>
        <label>年</label>
        <input type="number" id="year" placeholder="2010" min="1987" max="2099">
      </div>
      <div>
        <label>月</label>
        <input type="number" id="month" placeholder="08" min="1" max="12">
      </div>
      <div>
        <label>日</label>
        <input type="number" id="day" placeholder="15" min="1" max="31">
      </div>
    </div>

    <button onclick="calc()">计算我的华为工龄</button>
    <div class="error" id="error"></div>

    <div class="result" id="result">
      <div class="days-num"><span id="days">0</span><span class="days-unit">天</span></div>
      <div class="breakdown" id="breakdown"></div>
    </div>

    <div class="today" id="today"></div>
  </div>

<script>
  // 显示今天日期
  const now = new Date();
  document.getElementById('today').textContent =
    '今天是 ' + now.getFullYear() + ' 年 ' + (now.getMonth()+1) + ' 月 ' + now.getDate() + ' 日';

  // 回车触发计算
  ['year','month','day'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') calc();
    });
  });

  function calc() {
    const y = parseInt(document.getElementById('year').value, 10);
    const m = parseInt(document.getElementById('month').value, 10);
    const d = parseInt(document.getElementById('day').value, 10);
    const errEl = document.getElementById('error');
    const resEl = document.getElementById('result');
    errEl.textContent = '';
    resEl.classList.remove('show');

    if (!y || !m || !d) {
      errEl.textContent = '请完整填写年、月、日';
      return;
    }
    if (y < 1987 || y > 2099) {
      errEl.textContent = '年份请在 1987 - 2099 之间';
      return;
    }
    if (m < 1 || m > 12) {
      errEl.textContent = '月份请在 1 - 12 之间';
      return;
    }
    // 校验日期有效性
    const joinDate = new Date(y, m - 1, d);
    if (joinDate.getFullYear() !== y || joinDate.getMonth() !== m - 1 || joinDate.getDate() !== d) {
      errEl.textContent = '该日期不存在，请检查输入';
      return;
    }

    const today = new Date();
    today.setHours(0,0,0,0);
    joinDate.setHours(0,0,0,0);

    if (joinDate > today) {
      errEl.textContent = '入职日期不能晚于今天哦';
      return;
    }

    const diffMs = today - joinDate;
    const totalDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

    document.getElementById('days').textContent = totalDays.toLocaleString();

    // 分解为 年/月/天
    let years = today.getFullYear() - joinDate.getFullYear();
    let months = today.getMonth() - joinDate.getMonth();
    let days = today.getDate() - joinDate.getDate();
    if (days < 0) {
      months--;
      const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
      days += prevMonth.getDate();
    }
    if (months < 0) {
      years--;
      months += 12;
    }
    let parts = [];
    if (years > 0) parts.push(years + ' 年');
    if (months > 0) parts.push(months + ' 个月');
    if (days > 0 || parts.length === 0) parts.push(days + ' 天');
    document.getElementById('breakdown').textContent =
      '约等于 ' + parts.join(' ') + ' · 继续加油！';

    resEl.classList.add('show');
  }
</script>
</body>
</html>
